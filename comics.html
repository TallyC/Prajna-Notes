</style></head><body><header class="top"><a href="./">金剛經修行工具</a><a href="./">返回首頁</a></header><main><p class="eyebrow">七集講座 · 漫畫閱讀</p><h1>金剛經漫畫集</h1><p class="intro">本漫畫依據法鼓山果慨法師於安和分院主講的<a href="https://www.youtube.com/playlist?list=PLcl2UWn_SJlsm_daveK-1j4WxVYMpf2Y7" target="_blank" rel="noopener">《金剛經：現代生活的覺醒導引》七集講座</a>整理，以漫畫呈現講座重點。選一集，每次讀一頁；可用上一頁、下一頁接續，點圖放大後按「返回漫畫」。漫畫為重點轉譯，經文請回原典對讀。</p><nav class="jump" aria-label="選擇集數"><button type="button" data-chapter="1" aria-pressed="false">第1集</button><button type="button" data-chapter="2" aria-pressed="false">第2集</button><button type="button" data-chapter="3" aria-pressed="false">第3集</button><button type="button" data-chapter="4" aria-pressed="false">第4集</button><button type="button" data-chapter="5" aria-pressed="false">第5集</button><button type="button" data-chapter="6" aria-pressed="false">第6集</button><button type="button" data-chapter="7" aria-pressed="false">第7集</button></nav><section class="reader" id="reader" tabindex="-1" aria-label="漫畫閱讀"><div class="reader-head"><div><p id="reader-progress"></p><h2 id="reader-title"></h2></div></div><figure class="reader-figure"><button type="button" id="reader-zoom" aria-label="放大目前漫畫"><img id="reader-image" alt=""></button></figure><p class="reader-note" id="reader-note"></p><div class="reader-footer"><div class="controls"><button type="button" id="prev-page">上一頁</button><button type="button" id="next-page">下一頁</button></div><button class="zoom" id="reader-zoom-text" type="button">放大漫畫</button></div></section><dialog class="comic-dialog" id="comic-dialog" aria-label="放大漫畫"><div class="comic-dialog-head"><strong id="comic-dialog-title"></strong><button type="button" id="comic-dialog-close">返回漫畫 ×</button></div><img id="comic-dialog-image" alt=""></dialog><p class="note"><a href="https://cbetaonline.dila.edu.tw/zh/T0235">經文對讀：CBETA《金剛般若波羅蜜經》T0235</a></p></main><script id="comic-pages" type="application/json">[{"chapter": 1, "number": 1, "total": 3, "label": "第一集", "title": "從緣起看 "src": "./artwork/comics/episode-7-2.webp"}, {"chapter": 7, "number": 3, "total": 5, "label": "第七集", "title": "連自己的見解也要放下", "note": "佛法像渡河的船：善用它，也學著不再背著它走。", "src": "./artwork/comics/episode-7-3.webp"}, {"chapter": 7, "number": 4, "total": 5, "label": "第七集", "title": "為人演說，不取於相", "note": "日常陪伴與適時提醒，也能成為為人演說的練習。", "src": "./artwork/comics/episode-7-4.webp"}, {"chapter": 7, "number": 5, "total": 5, "label": "第七集", "title": "如夢幻泡影，回到調伏其心", "note": "心被境界帶走時，再回來，看清眼前的人與事。", "src": "./artwork/comics/episode-7-5.webp"}]</script><script>
(()=>{const pages=JSON.parse(document.getElementById('comic-pages').textContent);const $=id=>document.getElementById(id);let current=0;
function indexFromHash(){const m=location.hash.match(/^#episode-(\d+)(?:-page-(\d+))?$/);if(!m)return 0;const i=pages.findIndex(p=>p.chapter===Number(m[1])&&p.number===Number(m[2]||1));return i<0?0:i}
function show(index,scroll){current=index;const p=pages[index];$('reader-progress').textContent=`${p.label} · ${p.number} / ${p.total}`;$('reader-title').textContent=p.title;$('reader-note').textContent=p.note;$('reader-image').src=p.src;$('reader-image').alt=`${p.label}第 ${p.number} 頁：${p.title}`;$('prev-page').disabled=index===0;$('next-page').disabled=index===pages.length-1;document.querySelectorAll('[data-chapter]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.chapter)===p.chapter)));if(scroll)$('reader').scrollIntoView({behavior:'smooth',block:'start'})}
function zoom(){const p=pages[current];$('comic-dialog-title').textContent=`${p.label} · ${p.number} / ${p.total}`;$('comic-dialog-image').src=p.src;$('comic-dialog-image').alt=`${p.label}第 ${p.number} 頁：${p.title}`;$('comic-dialog').showModal()}
function go(index){const p=pages[index];location.hash=`episode-${p.chapter}-page-${p.number}`}
document.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>go(pages.findIndex(p=>p.chapter===Number(b.dataset.chapter)))));$('prev-page').addEventListener('click',()=>go(current-1));$('next-page').addEventListener('click',()=>go(current+1));$('reader-zoom').addEventListener('click',zoom);$('reader-zoom-text').addEventListener('click',zoom);$('comic-dialog-close').addEventListener('click',()=>$('comic-dialog').close());$('comic-dialog').addEventListener('click',e=>{if(e.target===$('comic-dialog'))$('comic-dialog').close()});window.addEventListener('hashchange',()=>show(indexFromHash(),true));show(indexFromHash(),false);
})();
</script></body></html>
